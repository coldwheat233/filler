<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LLM 语义匹配测试页</title>
<style>
  body { font: 14px/1.6 "Microsoft YaHei", sans-serif; background: #f0f2f5; }
  .wrap { max-width: 640px; margin: 30px auto; background: #fff; border-radius: 8px; padding: 24px 32px; }
  .form-item { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .field-label { width: 130px; text-align: right; color: #555; flex-shrink: 0; }
  input, select, textarea { flex: 1; border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .rep-block { border: 1px solid #e6e9ef; border-radius: 8px; padding: 12px 16px 4px; margin-bottom: 10px; background: #fbfcfe; }
  .add-btn { border: 1px dashed #1a73e8; color: #1a73e8; background: #f5f9ff; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  h2 { font-size: 15px; margin: 20px 0 12px; border-left: 3px solid #1a73e8; padding-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>基本信息（标签故意刁钻，规则匹配不上，必须走 LLM）</h2>
  <div class="form-item">
    <div class="field-label">你叫什么名字呀</div>
    <input type="text" id="weird-name" placeholder="请填写" />
  </div>
  <div class="form-item">
    <div class="field-label">平时用什么找到你</div>
    <input type="text" id="weird-phone" placeholder="请填写" />
  </div>
  <div class="form-item">
    <div class="field-label">呱呱坠地的日子</div>
    <input type="date" id="weird-birth" />
  </div>
  <div class="form-item">
    <div class="field-label">英语水平怎么样</div>
    <select id="weird-english">
      <option value="">请选择</option>
      <option>大学英语四级(CET-4)</option>
      <option>大学英语六级(CET-6)</option>
      <option>专业八级</option>
    </select>
  </div>

  <h2>社会实践（内置主题认不出，靠 LLM 认领到 social_practice 列表）</h2>
  <div id="sp-list">
    <div class="sp-item rep-block">
      <div class="form-item">
        <div class="field-label">实践单位</div>
        <input type="text" name="sp_org_0" />
      </div>
      <div class="form-item">
        <div class="field-label">实践内容</div>
        <textarea name="sp_desc_0"></textarea>
      </div>
    </div>
  </div>
  <button class="add-btn" id="sp-add" type="button">添加社会实践经历</button>
</div>

<template id="sp-tpl">
  <div class="sp-item rep-block">
    <div class="form-item">
      <div class="field-label">实践单位</div>
      <input type="text" name="sp_org_{i}" />
    </div>
    <div class="form-item">
      <div class="field-label">实践内容</div>
      <textarea name="sp_desc_{i}"></textarea>
    </div>
  </div>
</template>

<script>
  document.getElementById("sp-add").addEventListener("click", () => {
    const list = document.getElementById("sp-list");
    const idx = list.children.length;
    const node = document.getElementById("sp-tpl").content.firstElementChild.cloneNode(true);
    node.querySelectorAll("input,textarea").forEach((el) => {
      if (el.name) el.name = el.name.replace("{i}", idx);
      el.value = "";
    });
    list.appendChild(node);
  });
</script>
</body>
</html>
