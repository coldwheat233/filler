<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>网申填报助手</h1>
    <span id="llm-state" class="state"></span>
  </header>

  <section class="actions">
    <button id="btn-plan" class="primary">⚡ 生成当前页面填报计划</button>
    <div id="plan-msg" class="msg"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="tab-basic" class="on">基本</button>
    <button data-tab="tab-career">校招/求职</button>
    <button data-tab="tab-lists">经历段落</button>
    <button data-tab="tab-other">其他</button>
    <button data-tab="tab-json">JSON</button>
    <button data-tab="tab-llm">LLM</button>
  </nav>

  <main>
    <div id="tab-basic" class="tab on"></div>
    <div id="tab-career" class="tab"></div>
    <div id="tab-lists" class="tab"></div>
    <div id="tab-other" class="tab"></div>
    <div id="tab-json" class="tab">
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row">
        <button id="btn-json-apply" class="primary">应用 JSON → 表单</button>
        <button id="btn-json-sync">表单 → 生成 JSON</button>
        <span id="json-msg" class="msg"></span>
      </div>
      <p class="hint">JSON 是完整数据源：可在此增删任意字段、添加自定义经历列表
        （如 <code>"games": [...]</code>）。自定义段落命名对不上时，在「其他」页配置别名关键词。</p>
    </div>
    <div id="tab-llm" class="tab">
      <label>接口地址（OpenAI 兼容）<input id="llm-base" placeholder="https://api.deepseek.com/v1" /></label>
      <label>模型<input id="llm-model" placeholder="deepseek-chat" /></label>
      <label>API Key<input id="llm-key" type="password" placeholder="仅存本地" /></label>
      <div class="row"><button id="btn-save-llm" class="primary">保存 LLM 设置</button><span id="llm-msg" class="msg"></span></div>
      <p class="hint">不配置也可用：内置规则匹配常见字段，其余在计划中标出人工补填；
        配置后规则外字段走大模型语义匹配。</p>
    </div>
  </main>

  <footer>
    <button id="btn-save" class="primary wide">💾 保存简历</button>
    <div class="row">
      <span class="dim">测试页：仓库 demo/demo_form.html（需开「允许访问文件网址」或本地起服务）</span>
      <span id="save-msg" class="msg"></span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
